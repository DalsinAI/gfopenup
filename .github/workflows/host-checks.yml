# GFOpenUp's host checks: the parts tools/build_pack.py writes for the no-ROM-volume design (GFOpenPrefs in
# SYS:Preferences, the old homes archived, the lines by ROM), read through GFOpenUpTool's own condition code
# (tests/test_build_pack.py, tests/test_openup_lines.c), with gfopenprefs' GFOpenPrefs for the SECTION words.
name: Host checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: DalsinAI/gfopenprefs
          path: gfopenprefs
      - name: PIL, for the backdrops' tones (picture_tone)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends python3-pil
      - name: build_pack.py's parts and GFOpenUpTool's conditions
        run: OPENAMIGAPREFS=gfopenprefs python3 tests/test_build_pack.py
