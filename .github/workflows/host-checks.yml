# OpenUp's host checks: the parts tools/build_pack.py writes for the no-ROM-volume design (OpenPrefs in
# SYS:Preferences, the old homes archived, the lines by ROM), read through OpenUpTool's own condition code
# (tests/test_build_pack.py, tests/test_openup_lines.c), with openamigaprefs' OpenPrefs for the SECTION words.
name: Host checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: DalsinAI/openamigaprefs
          path: openamigaprefs
      - name: build_pack.py's parts and OpenUpTool's conditions
        run: OPENAMIGAPREFS=openamigaprefs python3 tests/test_build_pack.py
